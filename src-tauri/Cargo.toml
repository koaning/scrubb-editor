[package]
name = "scrubb"
version = "0.1.0"
description = "scrubb - cross-platform editor with scrubbable numeric literals"
authors = ["koaning"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "scrubb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
notify-debouncer-full = "0.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
